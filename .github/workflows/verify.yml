name: Verify OwnerTracker

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Verify private review transport
        run: node --test review-hosting/test/bridge.test.mjs

  windows-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Test launcher startup and shutdown controls
        working-directory: Windows-Server/windows
        env:
          GO111MODULE: 'off'
        run: go test -race -count=1
      - name: Compile launcher for Windows x64
        working-directory: Windows-Server
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/OwnerTrackerDesktop.exe" windows/OwnerTrackerDesktop.go
      - uses: actions/upload-artifact@v4
        with:
          name: OwnerTracker-Windows-x64
          path: ${{ runner.temp }}/OwnerTrackerDesktop.exe

  browser-workflows:
    # Keep the browser OS aligned with the pinned Playwright browser build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop and phone shop workflows with fictional data
        env:
          OWNERTRACKER_NODE: node
          OWNERTRACKER_BROWSER_ARTIFACTS: ${{ runner.temp }}/ownertracker-browser
        run: python Windows-Server/test/browser-shop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OwnerTracker-browser-review
          path: ${{ runner.temp }}/ownertracker-browser
          if-no-files-found: ignore
