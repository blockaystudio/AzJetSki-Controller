<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Previous POS · Customers & Receipts</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/ui-foundation.css"><style>main{max-width:1200px;margin:auto;padding:22px}.archive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:20px}input,select{max-width:100%}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #526273}.archive-scroll{overflow:auto}#detail{overflow-wrap:anywhere}@media print{body *{visibility:hidden}#detail,#detail *{visibility:visible}#detail{position:absolute;top:0;left:0;width:100%;background:white;color:black}#detail button{display:none}}</style></head><body><main><a class="btn" href="/desktop.html">Shop Desktop</a><h1>Previous POS Customers &amp; Receipts</h1><p id="status" role="status">Loading historical archive…</p><form id="search"><label>Search customer, phone, receipt, date, item or SKU<input name="q" maxlength="180" type="search"></label><label>Search records<select name="scope"><option value="receipts">Receipts</option><option value="customers">Customers</option></select></label><button class="btn primary">Search</button></form><p>Showing up to 50 matches. Customer history uses the original customer identifier. Walk-in and unmatched receipts are retained.</p><div class="archive-grid"><section class="card" id="results"></section><section class="card" id="detail"><h2>Historical receipt</h2><p>Select a receipt to see its original items and recovered payment details.</p></section></div></main><script type="module" src="/legacy-ui.js"></script></body></html>
