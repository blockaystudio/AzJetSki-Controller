<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1018"><title>Shop Operations · Owner Tracker</title><link rel="stylesheet" href="/styles.css"><style>
