<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>Shop Management · Owner Tracker</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#0b1018;color:#e5edf5}.management{max-width:1280px;margin:auto;padding:24px}.management header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.management-logo{height:60px;max-width:200px;object-fit:contain}.management h1{margin:0;font-size:28px}.management h2{font-size:21px}.management nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.management nav button.active{background:#2f9b75;color:#fff}.management-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.management .card{min-width:0;background:#151e2a;border:1px solid #2c3b4e}.management label{display:grid;gap:6px;margin:12px 0;color:#c9d6e3}.management input,.management select,.management textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #425369;border-radius:6px;background:#0d1621;color:#e5edf5}.management input[type=checkbox]{width:auto}.management .check-label{display:flex;align-items:center;gap:9px}.management button,.management .btn{cursor:pointer}.management .muted{color:#a6b6c8}.management .scroll{overflow:auto}.management table{width:100%;border-collapse:collapse}.management th,.management td{text-align:left;padding:12px 8px;border-bottom:1px solid #2c3b4e;vertical-align:top}.management small{color:#a6b6c8}.management .status{border-radius:20px;padding:3px 9px;background:#24364a;white-space:nowrap;font-size:12px}.management .notice{border:1px solid #486a60;border-radius:8px;padding:12px;background:#10251f}.management #message{position:sticky;top:0;z-index:2;margin:12px 0;padding:12px;background:#183b30;border-radius:8px;display:none}.management #message.error{background:#532b2b}.management .inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.management form button{margin-top:10px}.management .full{grid-column:1/-1}.management .stack{display:grid;gap:14px}@media(max-width:760px){.management{padding:14px}.management header{align-items:flex-start}.management h1{font-size:23px}.management-grid{grid-template-columns:1fr}.management-logo{height:45px;max-width:130px}.management th,.management td{font-size:13px;padding:9px 5px}}
</style><link rel="stylesheet" href="/ui-foundation.css"></head><body><main class="management"><header><div><a href="/"><img class="management-logo" src="/brand-logo.png" alt="AZ Jet Ski and Powersports"></a><h1>Shop Management</h1><p class="muted">Purchasing controls, receiving, customer communications and scheduling.</p></div><a class="btn" href="/">← POS</a></header><div id="shared-navigation"></div><p id="message" role="status"></p><nav id="tabs" aria-label="Management areas"></nav><div id="content"><p>Loading shop records…</p></div></main><script type="module" src="/shop-management.js"></script><script type="module" src="/shared-ui.js"></script></body></html>
