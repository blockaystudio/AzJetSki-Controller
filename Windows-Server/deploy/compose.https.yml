services:
  ownertracker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      OWNERTRACKER_DB: /app/data/ownertracker.sqlite
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the shop HTTPS URL in the private environment}
      TRUST_PROXY: 'true'
    volumes:
      - ../data:/app/data
      - ../backups:/app/backups
    expose:
      - '8787'
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?Set a domain pointing to this host}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on:
      - ownertracker
volumes:
  tls_data:
  tls_config:
